# MPC Tuning Variants
# ====================
# Use with: python run_pipeline.py --config configs/mpc_tuning.yaml --variant <name>

variants:
  conservative:
    dt: 0.1
    horizon: 8
    Q: [2.0, 2.0, 1.0, 0.2]
    R: [0.5, 0.5]
    max_steer: 0.4
    max_accel: 1.5
    max_speed: 2.0
    vehicle_length: 0.3
    num_iterations: 3

  aggressive:
    dt: 0.1
    horizon: 15
    Q: [0.5, 0.5, 0.2, 0.05]
    R: [0.05, 0.05]
    max_steer: 0.6
    max_accel: 3.0
    max_speed: 4.0
    vehicle_length: 0.3
    num_iterations: 5

  balanced:
    dt: 0.1
    horizon: 12
    Q: [1.0, 1.0, 0.5, 0.1]
    R: [0.1, 0.1]
    max_steer: 0.5
    max_accel: 2.0
    max_speed: 3.0
    vehicle_length: 0.3
    num_iterations: 3
